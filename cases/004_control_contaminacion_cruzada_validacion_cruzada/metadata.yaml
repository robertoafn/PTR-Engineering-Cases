validation:
  strategy: Validacion declarativa del punto nominal mediante DWSIM Automation API, balances de masa y energia, replica independiente de LMTD, evaluacion del margen de presion y una malla de sensibilidad U por caudal frio de 12 escenarios. La igualdad Q=U*A*F*LMTD se trata como cierre de la parametrizacion UA y no como validacion independiente. La paridad final del Caso 002 fue ejecutada y falla en energia; NRTL contra DECHEMA, VLE contra literatura y calorimetria permanecen NOT_RUN.
  acceptance_criteria: Balance de masa por lado <= 0.01%; residuo energetico <= 0.01% de Q; desviacion absoluta de LMTD <= 0.1 K; 12 escenarios de sensibilidad resueltos; margen limpio-contaminado > 0 Pa como tamiz nominal; paridad del Caso 002 <= 0.05%; ausencia de afirmaciones de rating geometrico, integridad mecanica o seguridad. El FAIL externo no bloqueante y los criterios requeridos sin evidencia conservan el veredicto CONDITIONAL y el ciclo de vida review.
