case_id: 004_control_contaminacion_cruzada_validacion_cruzada
title: Control de contaminacion cruzada y validacion cruzada de HX-301
phenomenon: Transferencia de calor sensible en un intercambiador contracorriente representado mediante un modelo global UA, junto con la evaluacion del margen de presion limpio menos contaminado como tamiz de direccion hidraulica ante una fuga hipotetica.
objective: Verificar de forma reproducible el punto nominal de HX-301 con U igual a 1000 W/(m^2*K), area igual a 13 m^2 y margen de presion limpio-contaminado de 50000 Pa, diferenciando la coherencia del modelo DWSIM de una validacion calorimetrica, geometrica, termodinamica o de seguridad independiente.
