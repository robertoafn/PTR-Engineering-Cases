title: Sensibilidad del HX-301 a U y caudal de agua fría
description: >-
  Malla de 12 escenarios resuelta mediante DWSIM 9.0.5 Automation3 sobre
  copias temporales del flowsheet. Cada escenario cambia U y el factor de
  caudal frío únicamente en memoria; el checksum del archivo fuente se
  verifica antes y después de cada ejecución.
